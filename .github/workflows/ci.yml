name: Verify
on: [push, pull_request]
jobs:
  local-game:
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_URL: postgresql://orcas:orcas@127.0.0.1:5432/orcas_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orcas
          POSTGRES_PASSWORD: orcas
          POSTGRES_DB: orcas_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U orcas -d orcas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:online
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
